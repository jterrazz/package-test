kind: api
description: a user created is the user listed
steps:
    - request: POST /users
      body:
          name: Dora
          email: dora@test.com
      response:
          status: 201
          body:
              user:
                  name: Dora
                  email: dora@test.com
    - request: GET /users
      response:
          status: 200
          body:
              users:
                  - name: Dora
                    email: dora@test.com
