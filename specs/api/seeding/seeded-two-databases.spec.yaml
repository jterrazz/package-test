kind: api
description: each database is seeded on its own, and each holds only its rows
seed:
    - { file: ../../seeds/two-users.sql, database: db }
    - { file: ../../seeds/two-events.sql, database: analyticsDb }
request: GET /events
response:
    status: 200
    body:
        events:
            - { type: user_created, payload: '{"name":"Alice"}' }
            - { type: user_created, payload: '{"name":"Bob"}' }
tables:
    users:
        database: db
        columns: [name]
        rows:
            - [Alice]
            - [Bob]
