kind: api
description: a leaf's seed lays its delta over a seed the specs root shares
seed:
    - { file: ../../seeds/two-users.sql, database: db }
    - { file: ./seeds/third-user.sql, database: db }
request: GET /users
response:
    status: 200
    body:
        users:
            - { name: Alice, email: alice@test.com }
            - { name: Bob, email: bob@test.com }
            - { name: Charlie, email: charlie@test.com }
