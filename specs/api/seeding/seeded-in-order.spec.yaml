kind: api
description: seeds apply in the order listed, each to the database it names
seed:
    - { file: ../../seeds/one-user.sql, database: db }
    - { file: ./seeds/third-user.sql, database: db }
    - { file: ../../seeds/one-event.sql, database: analyticsDb }
request: GET /users
response:
    status: 200
    body:
        users:
            - { name: Alice, email: alice@test.com }
            - { name: Charlie, email: charlie@test.com }
tables:
    events:
        database: analyticsDb
        columns: [type]
        rows:
            - [user_created]
