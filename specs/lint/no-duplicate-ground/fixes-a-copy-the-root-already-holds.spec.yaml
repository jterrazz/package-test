description: --fix deletes the copies of a seed the specs root already holds, and names the root's
fixture: ./_fixtures/pooled/
runs:
    - command: checker . --fix
      exit: 0
      files:
          specs/_shared/_seeds/two-users.sql:
              equals: |
                  INSERT INTO users (name) VALUES ('Alice'), ('Bob');
          specs/api/users/_seeds/two-users.sql: absent
          specs/api/orders/_seeds/two-users.sql: absent
          specs/api/users/listed.spec.ts:
              contains: file('../../_shared/_seeds/two-users.sql')
          specs/api/orders/orders.spec.ts:
              contains: file('../../_shared/_seeds/two-users.sql')
