description: --fix moves one copy to _shared/_seeds/ and every path naming either, a module test's too
fixture: ./_fixtures/copied/
runs:
    - command: checker . --fix
      exit: 0
      files:
          specs/_shared/_seeds/two-users.sql: exists
          specs/api/users/_seeds/two-users.sql: absent
          specs/api/orders/_seeds/two-users.sql: absent
          specs/api/orders/seeds: absent
          specs/api/users/listed.spec.ts:
              contains: file('../../_shared/_seeds/two-users.sql')
          specs/api/orders/orders.spec.ts:
              contains: file('../../_shared/_seeds/two-users.sql')
          lint/seeds.test.ts:
              contains:
                  - resolve(import.meta.dirname, '../specs/_shared/_seeds/two-users.sql')
                  - new URL('../specs/_shared/_seeds/two-users.sql', import.meta.url)
