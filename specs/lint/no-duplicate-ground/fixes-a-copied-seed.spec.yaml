description: --fix moves one copy to the _seeds/ its leaves share, and every path to either, a module test's too
fixture: ./_fixtures/copied/
runs:
    - command: checker . --fix
      exit: 0
      files:
          specs/api/_seeds/two-users.sql: exists
          specs/api/users/_seeds/two-users.sql: absent
          specs/api/orders/_seeds/two-users.sql: absent
          specs/api/users/listed.spec.ts:
              contains: file('../_seeds/two-users.sql')
          specs/api/orders/orders.spec.ts:
              contains: file('../_seeds/two-users.sql')
          lint/seeds.test.ts:
              contains:
                  - resolve(import.meta.dirname, '../specs/api/_seeds/two-users.sql')
                  - new URL('../specs/api/_seeds/two-users.sql', import.meta.url)
