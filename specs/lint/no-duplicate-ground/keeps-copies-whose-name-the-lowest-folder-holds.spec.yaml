description: --fix moves nothing when the lowest folder of their leaves holds another file of the copies' name
fixture: ./_fixtures/taken/
runs:
    - command: checker . --fix
      exit: 1
      stderr: |
          specs/api/orders/_seeds/two-users.sql:1:1  jterrazz-check(no-duplicate-ground)
          specs/api/users/_seeds/two-users.sql:1:1  jterrazz-check(no-duplicate-ground)
      files:
          specs/api/users/_seeds/two-users.sql: exists
          specs/api/orders/_seeds/two-users.sql: exists
          specs/api/_seeds/two-users.sql:
              contains: Carol
