description: --fix moves nothing when the copies' names disagree, since no name is the one to keep
fixture: ./_fixtures/renamed/
runs:
    - command: checker . --fix
      exit: 1
      stderr: |
          specs/api/orders/_seeds/two-users.sql:1:1  jterrazz-check(no-duplicate-ground)
          specs/api/users/_seeds/pair.sql:1:1  jterrazz-check(no-duplicate-ground)
      files:
          specs/api/orders/_seeds/two-users.sql: exists
          specs/api/users/_seeds/pair.sql: exists
          specs/_shared/seeds: absent
