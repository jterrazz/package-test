description: --fix moves one copy to shared/seeds/ and every path naming either, a module test's too
fixture: ./fixtures/copied/
runs:
    - command: checker . --fix
      exit: 0
      files:
          specs/shared/seeds/two-users.sql: exists
          specs/api/users/seeds/two-users.sql: absent
          specs/api/orders/seeds/two-users.sql: absent
          specs/api/orders/seeds: absent
          specs/api/users/listed.spec.ts:
              contains: file('../../shared/seeds/two-users.sql')
          specs/api/orders/orders.spec.ts:
              contains: file('../../shared/seeds/two-users.sql')
          lint/seeds.test.ts:
              contains:
                  - resolve(import.meta.dirname, '../specs/shared/seeds/two-users.sql')
                  - new URL('../specs/shared/seeds/two-users.sql', import.meta.url)
