description: --fix splits a file of two routes; the seed a module test reads too goes to the shared ground
fixture: ./fixtures/split/
runs:
    - command: checker . --fix
      exit: 0
      files:
          specs/api/orders/orders.spec.ts: absent
          specs/api/orders/seeds: absent
          specs/api/orders/list/seeds: absent
          specs/shared/seeds/one-order.sql: exists
          specs/api/orders/list/orders.spec.ts:
              contains: api.seed(file('../../../shared/seeds/one-order.sql'))
          specs/api/orders/create/orders.spec.ts:
              equals: |
                  import { describe, expect, test } from 'vitest';

                  import { api } from '../../api.specification.js';

                  const ORDER = { item: 'book' };

                  describe('orders', () => {

                      test('creates an order', async () => {
                          // Given - an empty table
                          const result = await api.post('/orders', ORDER);

                          // Then - the whole response
                          expect(result.response).toMatch(`HTTP/1.1 201 Created`);
                      });
                  });
          src/orders/orders.test.ts:
              contains: resolve(import.meta.dirname, '../../specs/shared/seeds/one-order.sql')
