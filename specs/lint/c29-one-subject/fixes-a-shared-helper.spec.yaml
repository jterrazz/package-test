description: --fix moves a helper two of the split files read into the leaf fixtures module, once
fixture: ./fixtures/shared-helper/
runs:
    - command: checker . --fix
      exit: 0
      files:
          specs/api/orders/orders.spec.ts: absent
          specs/api/orders/orders.fixtures.ts:
              equals: |
                  export const ITEM = 'book';

                  /** An order of the one item the catalogue sells. */
                  export function order(): { item: string } {
                      return { item: ITEM };
                  }
          specs/api/orders/create/orders.spec.ts:
              contains: import { order } from '../orders.fixtures.js';
          specs/api/orders/update/orders.spec.ts:
              contains: import { order } from '../orders.fixtures.js';
    - command: checker .
      exit: 0
    - command: .
      exit: 0
