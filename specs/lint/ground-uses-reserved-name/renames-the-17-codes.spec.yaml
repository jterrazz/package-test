description: --fix names every rule a 17.0 code still spells, in a directive and a baseline key
fixture: ./fixtures/on-17-codes/
runs:
    - command: checker . --fix
      exit: 0
      files:
          jterrazz.baseline.json:
              equals: |
                  {
                      "test": {
                          "jterrazz-check/no-unused-ground": 1
                      }
                  }
          specs/cli/build/build.spec.ts:
              contains: |
                  // oxlint-disable-next-line jterrazz/no-raw-bypass -- asserts the colour codes themselves (a 17.0 id that no longer exists)
                          expect(result.stdout.raw).toContain('[31m');
                          // checker-disable-next-line document-env-and-serve-registered, named-path-exists, no-malformed-ref, no-unknown-token -- written by the build (codes that no longer exist)
