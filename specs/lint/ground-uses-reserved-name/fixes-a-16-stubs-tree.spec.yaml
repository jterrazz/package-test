description: --fix moves a 16 tree and its module tests from contracts to stubs
fixture: ./fixtures/on-16-stubs/
runs:
    - command: checker --fix
      exit: 0
      files:
          specs/api/news/list/contracts/newsroom.contracts.ts: absent
          specs/api/news/list/stubs/newsroom.stubs.ts:
              contains: 'export const newsroom: Stubs = defineStubs(events);'
          specs/api/news/list/stubs/http/events.ts:
              contains: '// oxlint-disable-next-line jterrazz/stubs-root-holds-facades-and-kinds -- a 16 id that no longer exists'
          specs/api/news/list/list.spec.ts:
              contains: "import { newsroom } from './stubs/newsroom.stubs.js';"
          src/rates/stubs/http/eur.ts:
              contains: 'export default defineStub({'
          src/rates/rates.test.ts:
              contains: "import { rates } from './stubs/rates.stubs.js';"
