description: --fix moves the lonely seed into its leaf's seeds/ and rewrites the path that named it
fixture: ./fixtures/lonely-seed/
runs:
    - command: checker . --fix
      exit: 0
      files:
          specs/seeds/one-user.sql: absent
          specs/api/users/seeds/one-user.sql: exists
          specs/api/users/listed.spec.yaml:
              contains: 'seed: ./seeds/one-user.sql'
