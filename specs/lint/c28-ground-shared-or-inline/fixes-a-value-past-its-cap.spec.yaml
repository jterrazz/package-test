description: --fix writes a value past its cap to a file named from its test, and names it with file()
fixture: ./fixtures/past-cap/
runs:
    - command: checker . --fix
      exit: 0
      files:
          specs/api/users/requests/creates-a-crowd.json:
              contains: '"role 25"'
          specs/api/users/expected/lists-everyone.http:
              contains: "content-type: text/plain\n\nuser 0\n"
          specs/api/users/created.spec.ts:
              contains: api.post('/users', file('./requests/creates-a-crowd.json'))
    - command: checker .
      exit: 0
