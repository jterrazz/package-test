description: --fix writes each SQL to a seed beside its spec, named by its comment or four words of its test
fixture: ./fixtures/inline-sql/
runs:
    - command: checker . --fix
      exit: 0
      files:
          specs/api/users/seeds/two-users-one-admin.sql:
              equals: |
                  -- Two users, one admin
                  INSERT INTO users (name, admin) VALUES ('Ada', true), ('Grace', false);
          specs/api/users/seeds/lists-users.sql:
              equals: |
                  INSERT INTO users (name) VALUES ('Linus');
          specs/api/users/seeds/lists-users-2.sql:
              equals: |-
                  INSERT INTO users (name) VALUES ('Joan');
          specs/api/users/listed.spec.ts:
              equals: |
                  import { file } from '@jterrazz/test'; // checker-disable-line c30 -- an input of C28: this folder is the case the rule reads, not a subject's standard name
                  import { expect, test } from 'vitest';

                  import { api } from '../api.specification.js';

                  test('lists the users', async () => {
                      // Given - two users, the first named by its comment, the second by this test's title, its filler dropped — a name another seed holds
                      const result = await api
                          .seed(file('./seeds/two-users-one-admin.sql'))
                          .seed(file('./seeds/lists-users-2.sql'))
                          .get('/users');

                      // Then - the users
                      expect(result.response).toMatch('HTTP/1.1 200 OK');
                  });

                  test('lists the user its seed file holds', async () => {
                      // Given - one user, from the seed this test alone reads
                      const result = await api.seed(file('./seeds/lists-users.sql')).get('/users');

                      // Then - the user
                      expect(result.response).toMatch('HTTP/1.1 200 OK');
                  });
