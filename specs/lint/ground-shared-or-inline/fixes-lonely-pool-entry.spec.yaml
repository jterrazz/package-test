description: --fix moves the lonely pool fixture beside its leaf, repoints it and removes the emptied pool
fixture: ./_fixtures/lonely/
runs:
    - command: checker . --fix
      exit: 0
      files:
          specs/_shared/_fixtures/lonely-stub/main.js: absent
          specs/_shared/fixtures: absent
          specs/widget/_fixtures/lonely-stub/main.js: exists
          specs/widget/widget.test.ts:
              contains: ./_fixtures/lonely-stub/
