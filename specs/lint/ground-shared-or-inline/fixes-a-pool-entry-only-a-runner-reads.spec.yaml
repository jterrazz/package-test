description: --fix moves a pool fixture one facet's runner alone reads into that facet's _fixtures/
fixture: ./_fixtures/runner-read/
runs:
    - command: checker . --fix
      exit: 0
      files:
          specs/_shared: absent
          specs/cli/_fixtures/shop/cli.sh: exists
          specs/cli/cli.specification.ts:
              contains: resolve(import.meta.dirname, './_fixtures/shop/cli.sh')
    - command: checker .
      exit: 0
