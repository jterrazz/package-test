description: --fix leaves a pool fixture a module test names by pieces, and the module test as written
fixture: ./fixtures/module-read-pieces/
runs:
    - command: checker . --fix
      exit: 0
      files:
          specs/shared/fixtures/lonely-stub/main.js: exists
          specs/widget/fixtures: absent
          src/stub/stub.test.ts:
              equals: |
                  import { resolve } from 'node:path';
                  import { describe, expect, test } from 'vitest';

                  /** The stub, named from this module test piece by piece. */
                  const STUB = resolve(import.meta.dirname, '..', '..', 'specs', 'shared', 'fixtures', 'lonely-stub');

                  describe('stub', () => {
                  test('names the stub', () => {
                      // Given - the stub's folder
                      // Then - it is named
                      expect(STUB).toContain('lonely-stub');
                  });
                  });
