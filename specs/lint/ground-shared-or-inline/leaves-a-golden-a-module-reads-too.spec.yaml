description: --fix leaves a golden a module test reads too a file, and its one test as written
fixture: ./_fixtures/module-read-golden/
runs:
    - command: checker . --fix
      exit: 0
      files:
          specs/notes/_expected/line.txt: exists
          specs/notes/line.spec.ts:
              equals: |
                  import { file, text } from '@jterrazz/test';
                  import { describe, expect, test } from 'vitest';

                  describe('line', () => {
                  test('a golden a module test reads too', () => {
                      // Given - the line
                      // Then - it matches the golden the module test also reads
                      expect(text('one line')).toMatch(file('./_expected/line.txt'));
                  });
                  });
