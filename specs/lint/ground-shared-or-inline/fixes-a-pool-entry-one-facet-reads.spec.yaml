description: --fix moves the seed two sibling routes share into the _seeds/ of their folder, both reaching it
fixture: ./_fixtures/sibling-routes/
runs:
    - command: checker . --fix
      exit: 0
      files:
          specs/_shared: absent
          specs/api/map/_seeds/two-pois.sql: exists
          specs/api/map/pois/listing.spec.ts:
              contains: file('../_seeds/two-pois.sql')
          specs/api/map/areas/listing.spec.ts:
              contains: file('../_seeds/two-pois.sql')
    - command: checker .
      exit: 0
