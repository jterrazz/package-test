description: --fix moves the seed one leaf's two tests share into its _seeds/ and removes the emptied folder
fixture: ./_fixtures/lonely-seed/
runs:
    - command: checker . --fix
      exit: 0
      files:
          specs/_shared/_seeds/one-user.sql: absent
          specs/_shared/seeds: absent
          specs/api/users/_seeds/one-user.sql: exists
          specs/api/users/listed.spec.ts:
              contains: file('./_seeds/one-user.sql')
