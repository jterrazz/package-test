name: Validate

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    # hazard: the mobile specification runs on the shared runner core, which no path filter of the shared workflow can see: once a week the simulator runs whatever changed.
    schedule:
        - cron: '0 6 * * 1'

jobs:
    validate:
        uses: jterrazz/jterrazz-actions/.github/workflows/validate.yaml@main
        with:
            node-version: '24'
            browsers: true
