name: Validate

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        - cron: '0 6 * * 1'

jobs:
    validate:
        uses: jterrazz/jterrazz-actions/.github/workflows/validate.yaml@main
        with:
            node-version: '24'
            browsers: true
