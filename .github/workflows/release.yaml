name: Release

on:
    release:
        types: [created]

permissions:
    contents: read
    id-token: write

jobs:
    release:
        uses: jterrazz/studio-actions/.github/workflows/release-npm.yaml@main
        with:
            node-version: '24'
            # invariant: the same input validate.yaml takes: the publish gate runs the suite the push gate ran.
            browsers: true
        secrets: inherit
